# KÈNÈYA — configuration de PRODUCTION.
#
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod up -d --build
#
# `docker/docker-compose.yml` reste le fichier de **developpement** : mot de
# passe Postgres connu, ports ouverts, NODE_ENV=development. Il ne doit jamais
# servir sur un serveur expose.
#
# Ce fichier-ci :
# - n'ecrit aucun secret : chacun est une variable **obligatoire** (`${X:?}`),
#   et `docker compose` refuse de demarrer si l'une manque ;
# - ne publie pas Redis, et lui impose un mot de passe ;
# - ne publie Postgres que sur 127.0.0.1 du serveur : joignable par tunnel SSH
#   pour les migrations (voir le job Deploy de la CI), jamais depuis Internet ;
# - lance l'API en NODE_ENV=production : cookies `Secure`, OTP jamais renvoye
#   dans la reponse, messages d'erreur internes masques.
#
# Les secrets vivent dans docker/.env.prod, **hors du depot** (voir
# docker/.env.prod.example pour la liste).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keneya}
      POSTGRES_USER: ${POSTGRES_USER:-keneya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
    ports:
      - '127.0.0.1:${POSTGRES_PORT_LOCAL:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pas de `ports` : seul le reseau interne de compose y accede.
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD obligatoire}']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD obligatoire}

  # Joue les migrations, puis s'arrete. L'API ne demarre qu'apres sa reussite.
  #
  # L'image de production ne contient pas la CLI prisma : elle en est retiree
  # a dessein (voir apps/api/Dockerfile). Les migrations etaient donc jouees
  # depuis le runner de la CI, ce qui obligeait a rendre la base joignable
  # depuis l'exterieur. Ce service les joue depuis le serveur lui-meme, en
  # reutilisant la cible `build` de la meme image, ou la CLI est presente.
  # L'image de production reste mince, et un deploiement n'a plus besoin de
  # rien d'autre que ce fichier.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /repo/apps/api
    command: ['npx', 'prisma', 'migrate', 'deploy', '--config', 'prisma.config.ts']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-keneya}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}@postgres:5432/${POSTGRES_DB:-keneya}
    depends_on:
      postgres:
        condition: service_healthy
    # Une migration qui echoue doit arreter le deploiement, pas boucler.
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-keneya}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}@postgres:5432/${POSTGRES_DB:-keneya}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD obligatoire}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obligatoire}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET obligatoire}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY obligatoire}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS obligatoire (https://...)}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL obligatoire (https://...)}
      # Deux mandataires devant l'API : le proxy du serveur, puis le nginx du
      # service web. Sans ce compte, `req.ip` vaut la meme adresse pour tous
      # les visiteurs : la limite de debit devient commune a tous, et les
      # journaux d'acces perdent l'adresse reelle du client.
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Sans expediteur, aucun professionnel ne recoit son code a usage
      # unique, et l'API refuse la connexion plutot que de reveler le code :
      # la cle Brevo et l'adresse d'expedition sont donc obligatoires.
      # Le relais SMTP et Gmail restent des replis facultatifs, dans cet
      # ordre de priorite (voir services/courriel.service.ts).
      BREVO_API_KEY: ${BREVO_API_KEY:?BREVO_API_KEY obligatoire}
      # Doit etre une adresse validee chez Brevo, sur un domaine authentifie :
      # Brevo refuse d'expedier depuis une adresse qu'il ne connait pas.
      EMAIL_EXPEDITEUR: ${EMAIL_EXPEDITEUR:?EMAIL_EXPEDITEUR obligatoire}
      EMAIL_REPONSE: ${EMAIL_REPONSE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      USSD_HMAC_KEY: ${USSD_HMAC_KEY:-}
      USSD_ALLOWED_IPS: ${USSD_ALLOWED_IPS:-}
      CHAPCHAP_API_KEY: ${CHAPCHAP_API_KEY:-}
      CHAPCHAP_HMAC_KEY: ${CHAPCHAP_HMAC_KEY:-}
      CHAPCHAP_CALLBACK_URL: ${CHAPCHAP_CALLBACK_URL:-}
    # Pas de `ports` : l'API n'est joignable que par le proxy nginx du service web.
    #
    # Les fichiers televerses ne vivent **pas** dans le conteneur : sans ces
    # deux volumes, chaque redeploiement les effacait tous. Les avatars et les
    # logos se reparent en les reposant ; les pieces d'agrement, non — elles
    # sont la preuve sur laquelle une structure a ete admise, et le candidat
    # n'a aucun moyen de les redeposer apres validation.
    volumes:
      # `stockage-prive/` n'est jamais servi en statique : chaque lecture
      # passe par une route gardee et journalisee.
      - api_stockage_prive:/repo/apps/api/stockage-prive
      # `uploads/` est servi sans authentification : avatars, logos, photos.
      - api_uploads:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Une API qui demarre sur un schema non migre repond des erreurs que
      # personne ne relie a la cause : mieux vaut qu'elle ne demarre pas.
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Le seul point d'entree. Un terminal TLS doit se trouver devant : les
    # cookies `Secure` de la production exigent HTTPS. Avec Dokploy, c'est
    # Traefik, qui joint ce service par le reseau Docker — pas par un port
    # publie.
    #
    # D'ou la publication sur 127.0.0.1 seulement : sur un serveur, un
    # `8080:8080` ordinaire ouvrirait le site en clair sur l'adresse
    # publique, a cote du HTTPS et sans que rien ne le signale. Ici le port
    # ne sert qu'a verifier depuis le serveur meme, ou par un tunnel SSH.
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    expose:
      - '8080'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_stockage_prive:
  api_uploads:
