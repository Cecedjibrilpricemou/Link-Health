name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'

jobs:
  # ── API ──────────────────────────────────────────────────────────────
  api-build-test:
    name: API — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://baobaoheath:baobaoheath@localhost:5432/baobaoheath_test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars
      # src/config/env.ts valide l'environnement a l'import et quitte le
      # processus si une variable requise manque. Sans cette cle, toute suite
      # qui importe un service echouait avec « process.exit called with 1 ».
      # Valeur de test uniquement : 64 caracteres hexadecimaux, jamais utilisee
      # pour chiffrer des donnees reelles.
      DB_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NODE_ENV: test
      PORT: 3000

    steps:
      - uses: actions/checkout@v5

      # Postgres demarre ici plutot qu'en conteneur de service : voir
      # .github/scripts/demarrer-postgres.sh (nouvelles tentatives, registres
      # de secours).
      - name: Start Postgres
        working-directory: .
        run: bash .github/scripts/demarrer-postgres.sh baobaoheath_test 5432

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run migrations
        run: npx prisma migrate deploy --config prisma.config.ts

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ── Dependencies Security audit ──────────────────────────────────────
  # audit-gate.mjs checks the root package-lock.json for all npm workspaces.
  dependencies-audit:
    name: Dependencies — Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: node scripts/audit-gate.mjs

  # ── Frontend ─────────────────────────────────────────────────────────
  web-build:
    name: Web — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      # **Les tests du front ne tournaient nulle part.** Le job API lance
      # "npm test", le job web se contentait de compiler : un test unitaire
      # ajoute cote navigateur ne gardait donc rien. Le lanceur sort en erreur
      # quand il ne trouve aucun fichier, ce qui couvre aussi le cas ou la
      # decouverte des specs casse en silence.
      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build production
        run: npm run build -- --configuration=production

  # ── Source-code security scan ────────────────────────────────────────
  semgrep:
    name: Semgrep — Code Scan (report only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Scan source code
        # Report findings in the Actions log without blocking CI during the
        # initial review period. Tool/setup failures still fail the job.
        run: semgrep scan --config p/default --metrics=off

  # ── End-to-end ────────────────────────────────────────────────────────
  # Vrai navigateur contre la vraie API et un Postgres de service : les trois
  # parcours ASC -> medecin -> pharmacien (apps/web/e2e). Le setup Playwright
  # migre et seed la base, puis demarre API et front lui-meme.
  e2e:
    name: E2E — Parcours
    runs-on: ubuntu-latest
    needs: [api-build-test, web-build]
    timeout-minutes: 25

    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://baobaoheath:baobaoheath@localhost:55433/baobaoheath_e2e
      # prisma.config.ts lit DATABASE_URL des le chargement, y compris pour `generate`.
      DATABASE_URL: postgresql://baobaoheath:baobaoheath@localhost:55433/baobaoheath_e2e

    steps:
      - uses: actions/checkout@v5

      # Postgres demarre ici plutot qu'en conteneur de service : voir
      # .github/scripts/demarrer-postgres.sh (nouvelles tentatives, registres
      # de secours).
      - name: Start Postgres
        working-directory: .
        run: bash .github/scripts/demarrer-postgres.sh baobaoheath_e2e 55433

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts
        working-directory: apps/api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run e2e
        run: npm run e2e
        working-directory: apps/web

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # ── CD — Deploy to production ─────────────────────────────────────────
  # Triggers on push to main only after all CI jobs pass.
  # Requires secrets: DATABASE_URL, DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  #
  # Le job est ignore tant que la variable de depot DEPLOY_ENABLED n'est pas
  # a 'true' (Settings > Secrets and variables > Actions > Variables). Sans
  # cela, le job tournait sans aucun secret configure : `prisma migrate deploy`
  # echouait sur un DATABASE_URL vide et chaque push sur main envoyait un
  # email « CI failed » alors que la chaine de tests etait verte.
  # (Le contexte `secrets` n'est pas accessible dans un `if` de job, d'ou une
  # variable plutot qu'un test direct sur les secrets.)
  deploy:
    name: Deploy — Migrate + Restart
    runs-on: ubuntu-latest
    needs: [api-build-test, dependencies-audit, web-build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/api

      - name: Generate Prisma client
        run: npx prisma generate --config prisma.config.ts
        working-directory: apps/api

      - name: Run database migrations
        run: npx prisma migrate deploy --config prisma.config.ts
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy via SSH
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/baobaoheath
            git pull origin main
            docker compose pull api
            docker compose up -d --no-deps api
            docker compose exec -T api sh -c "until wget -qO- http://localhost:3000/health | grep -q '\"success\":true'; do sleep 2; done"
            echo "Deploy successful"
