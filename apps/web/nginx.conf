server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse proxy to the API container so the SPA can call same-origin
    # relative URLs (see src/environments/environment.prod.ts apiUrl).
    # Jamais mis en cache : ce sont des donnees medicales.
    location /api/ {
        # **La taille d'un dossier, pas celle d'un formulaire.** Sans cette
        # ligne, nginx garde son defaut de 1 Mo pour tout le corps : la
        # creation d'une assurance (quatre scans), d'une structure ou d'une
        # demande d'agrement echouait en 413 des que les pieces depassaient
        # 1 Mo ensemble - apres le televersement, et l'API ne voyait rien.
        # L'API accepte jusqu'a dix pieces de 5 Mo (upload.middleware) : 55 Mo
        # couvrent le dossier le plus lourd et l'enveloppe multipart, et
        # multer reste seul juge de chaque fichier.
        client_max_body_size 55m;
        error_page 413 @trop_volumineux;

        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le refus de nginx, dans la forme des erreurs de l'API : l'ecran lit
    # `error` et l'affiche, au lieu d'une page HTML qu'il ne sait pas lire et
    # qui devenait « Une erreur est survenue ».
    location @trop_volumineux {
        default_type "application/json; charset=utf-8";
        return 413 '{"success":false,"error":"Les fichiers envoyés sont trop volumineux pour le serveur : 50 Mo au plus pour l\'ensemble, 5 Mo par pièce."}';
    }

    # ── Cache HTTP (faible debit) ────────────────────────────────────────
    #
    # Les fichiers dont le nom porte une empreinte (outputHashing: all :
    # main-C5WO3AC6.js, chunk-26ESX2N3.js, styles-....css) changent de nom a
    # chaque modification : ils se gardent un an sans jamais etre revalides.
    location ~* "^/[a-z0-9_.-]+-[a-z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Logos et photos de profil televerses : l'API les sert et les enregistre
    # par leur chemin (/uploads/...). Sans ce relais, ces chemins tombaient
    # sur le repli de `location /` et recevaient index.html.
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Polices et images referencees par le CSS : le build les copie dans
    # /media/ avec une empreinte dans le nom.
    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Le service worker et son manifeste disent quelle version charger : mis
    # en cache, ils empecheraient toute mise a jour d'arriver.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    # index.html (et le repli des routes de l'application) : revalide a chaque
    # visite, pour que la nouvelle version soit vue des sa publication.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
