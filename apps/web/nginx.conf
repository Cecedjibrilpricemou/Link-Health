server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse proxy to the API container so the SPA can call same-origin
    # relative URLs (see src/environments/environment.prod.ts apiUrl).
    # Jamais mis en cache : ce sont des donnees medicales.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Cache HTTP (faible debit) ────────────────────────────────────────
    #
    # Les fichiers dont le nom porte une empreinte (outputHashing: all :
    # main-C5WO3AC6.js, chunk-26ESX2N3.js, styles-....css) changent de nom a
    # chaque modification : ils se gardent un an sans jamais etre revalides.
    location ~* "^/[a-z0-9_.-]+-[a-z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Logos et photos de profil televerses : l'API les sert et les enregistre
    # par leur chemin (/uploads/...). Sans ce relais, ces chemins tombaient
    # sur le repli de `location /` et recevaient index.html.
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Polices et images referencees par le CSS : le build les copie dans
    # /media/ avec une empreinte dans le nom.
    location /media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Le service worker et son manifeste disent quelle version charger : mis
    # en cache, ils empecheraient toute mise a jour d'arriver.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    # index.html (et le repli des routes de l'application) : revalide a chaque
    # visite, pour que la nouvelle version soit vue des sa publication.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
